AddonId: 1d4f96d1-ea52-4f70-9b3d-e2ec0a7d5f70
Type: Generic
Name: OptiScaler 管理器
Author: xh1572
ShortDescription: Install, update, configure and remove OptiScaler for your installed games from the Playnite sidebar.
Description: |
  Manages OptiScaler for games installed in Playnite, without rescanning game stores.
  - Install, update and uninstall OptiScaler (stable / beta / nightly) with external backups, hash-based conflict checks and rollback.
  - Quick settings, a full OptiScaler.ini editor and reusable profiles.
  - FSR4 DLL swap using INT8 / FP8 builds from OptiScaler Extras, with or without OptiScaler.
  The plugin does not bundle OptiScaler or other third-party DLLs; they are downloaded from their official GitHub releases.
  All code in this project was generated by AI (Claude and GPT / Codex).
